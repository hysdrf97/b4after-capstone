
# ==============================================================
# B4 After - Capstone Infrastruktur Hybrid Cloud
# Topik: Exploding User Data Scalabilities (CIMB Niaga)
# Cloud Infrastructure Engineer: Firda Aisyah
# ==============================================================

networks:
  b4after-net:
    driver: bridge

volumes:
  postgres-primary-data:
  postgres-replica-data:
  redis-data:
  prometheus-data:
  grafana-data:
  rabbitmq-data:

services:

  # ============================================================
  # NGINX - Load Balancer (pintu masuk semua traffic)
  # ============================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: b4after-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
    networks:
      - b4after-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # API SERVICE - Instance pertama (on-premise / server lokal)
  # ============================================================
  api-1:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: b4after-api-1
    environment:
      - DB_HOST=postgres-primary
      - DB_PORT=5432
      - DB_USER=b4after
      - DB_PASSWORD=b4after_secret
      - DB_NAME=bankdb
      - DB_REPLICA_HOST=postgres-replica
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://b4after:b4after_secret@rabbitmq:5672/
      - APP_PORT=8080
      - INSTANCE_ID=api-1
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - b4after-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ============================================================
  # API SERVICE - Instance kedua (cloud replica - scale out)
  # Diaktifkan oleh autoscaler saat threshold tercapai
  # ============================================================
  api-2:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: b4after-api-2
    environment:
      - DB_HOST=postgres-primary
      - DB_PORT=5432
      - DB_USER=b4after
      - DB_PASSWORD=b4after_secret
      - DB_NAME=bankdb
      - DB_REPLICA_HOST=postgres-replica
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://b4after:b4after_secret@rabbitmq:5672/
      - APP_PORT=8080
      - INSTANCE_ID=api-2
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - b4after-net
    restart: unless-stopped
    profiles:
      - scale  # hanya aktif saat di-scale
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ============================================================
  # API SERVICE - Instance ketiga (cloud replica 2)
  # ============================================================
  api-3:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: b4after-api-3
    environment:
      - DB_HOST=postgres-primary
      - DB_PORT=5432
      - DB_USER=b4after
      - DB_PASSWORD=b4after_secret
      - DB_NAME=bankdb
      - DB_REPLICA_HOST=postgres-replica
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://b4after:b4after_secret@rabbitmq:5672/
      - APP_PORT=8080
      - INSTANCE_ID=api-3
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - b4after-net
    restart: unless-stopped
    profiles:
      - scale-max  # hanya aktif saat beban sangat tinggi
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ============================================================
  # POSTGRESQL PRIMARY - Database utama (write operations)
  # ============================================================
  postgres-primary:
    image: postgres:15-alpine
    container_name: b4after-postgres-primary
    environment:
      - POSTGRES_USER=b4after
      - POSTGRES_PASSWORD=b4after_secret
      - POSTGRES_DB=bankdb
      - POSTGRES_REPLICATION_USER=replicator
      - POSTGRES_REPLICATION_PASSWORD=replicator_secret
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./postgres/primary.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      - "5432:5432"
    networks:
      - b4after-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b4after -d bankdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G

  # ============================================================
  # POSTGRESQL REPLICA - Database read replica (read operations)
  # Memisahkan beban baca dan tulis (read/write separation)
  # ============================================================
  postgres-replica:
    image: postgres:15-alpine
    container_name: b4after-postgres-replica
    environment:
      - POSTGRES_USER=b4after
      - POSTGRES_PASSWORD=b4after_secret
      - POSTGRES_DB=bankdb
      - PGUSER=replicator
      - PGPASSWORD=replicator_secret
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
    networks:
      - b4after-net
    depends_on:
      postgres-primary:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b4after -d bankdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # REDIS - Caching layer (mengurangi beban database)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: b4after-redis
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --requirepass redis_secret
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - b4after-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_secret", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  # ============================================================
  # RABBITMQ - Message Queue (async transaction processing)
  # ============================================================
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: b4after-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=b4after
      - RABBITMQ_DEFAULT_PASS=b4after_secret
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI
    networks:
      - b4after-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ============================================================
  # PROMETHEUS - Metrics collector (monitoring)
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: b4after-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - b4after-net
    restart: unless-stopped

  # ============================================================
  # GRAFANA - Dashboard visualisasi metrics
  # ============================================================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: b4after-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - b4after-net
    restart: unless-stopped

  # ============================================================
  # NODE EXPORTER - Metrics sistem host (CPU, RAM, disk)
  # ============================================================
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: b4after-node-exporter
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    networks:
      - b4after-net
    restart: unless-stopped
    pid: host

  # ============================================================
  # CADVISOR - Metrics container Docker
  # ============================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: b4after-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    networks:
      - b4after-net
    restart: unless-stopped
    privileged: true
