# ==============================================================
# NGINX Load Balancer Configuration
# B4 After - Cloud Infrastructure
# ==============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    # Logging format dengan request time untuk monitoring latency
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # Performance tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json text/plain application/xml;

    # Rate limiting - proteksi peak load
    # 100 request/detik per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    # 1000 request/detik untuk transaksi (lebih longgar)
    limit_req_zone $binary_remote_addr zone=txn_limit:10m rate=1000r/s;

    # ============================================================
    # Upstream - Daftar API server yang tersedia
    # Nginx akan otomatis skip server yang down (failover)
    # ============================================================
    upstream api_backend {
        # Algoritma least_conn: kirim request ke server paling sedikit koneksinya
        least_conn;

        server api-1:8080 weight=1 max_fails=3 fail_timeout=30s;
        server api-2:8080 weight=1 max_fails=3 fail_timeout=30s backup;
        server api-3:8080 weight=1 max_fails=3 fail_timeout=30s backup;

        # Keepalive connections ke upstream
        keepalive 64;
    }

    # ============================================================
    # Server Block - HTTP
    # ============================================================
    server {
        listen 80;
        server_name localhost;

        # Timeout settings
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Header yang diteruskan ke API
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # --------------------------------------------------------
        # Health check endpoint
        # --------------------------------------------------------
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx-lb"}';
            add_header Content-Type application/json;
        }

        # --------------------------------------------------------
        # Nginx status (untuk monitoring)
        # --------------------------------------------------------
        location /nginx-status {
            stub_status on;
            access_log off;
            allow 172.0.0.0/8;
            deny all;
        }

        # --------------------------------------------------------
        # Write-heavy endpoints (transaksi)
        # Rate limit lebih ketat, timeout lebih panjang
        # --------------------------------------------------------
        location ~ ^/api/v1/(transactions|transfer|payment) {
            limit_req zone=txn_limit burst=200 nodelay;
            limit_req_status 429;

            proxy_pass http://api_backend;
            proxy_next_upstream error timeout http_500 http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        # --------------------------------------------------------
        # Read-heavy endpoints (inquiry, balance, status)
        # Bisa di-cache oleh API layer menggunakan Redis
        # --------------------------------------------------------
        location ~ ^/api/v1/(balance|status|inquiry|profile) {
            limit_req zone=api_limit burst=500 nodelay;
            limit_req_status 429;

            proxy_pass http://api_backend;
            proxy_next_upstream error timeout http_500 http_502 http_503;
            proxy_next_upstream_tries 3;

            # Cache hint header
            add_header X-Cache-Hint "cacheable" always;
        }

        # --------------------------------------------------------
        # Semua endpoint API lainnya
        # --------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=100 nodelay;
            limit_req_status 429;

            proxy_pass http://api_backend;
            proxy_next_upstream error timeout http_500 http_502 http_503;
        }

        # --------------------------------------------------------
        # Error handling
        # --------------------------------------------------------
        error_page 429 = @rate_limited;
        error_page 502 503 504 = @upstream_error;

        location @rate_limited {
            default_type application/json;
            return 429 '{"error":"too_many_requests","message":"Terlalu banyak request, coba lagi sebentar","retry_after":1}';
        }

        location @upstream_error {
            default_type application/json;
            return 503 '{"error":"service_unavailable","message":"Layanan sedang sibuk, mohon tunggu sebentar"}';
        }
    }
}
